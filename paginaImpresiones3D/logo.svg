<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0e1e38"/>
      <stop offset="100%" stop-color="#080c14"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="blueSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#002b7a"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="150" cy="150" r="146" fill="url(#bgGlow)" stroke="#16243c" stroke-width="4"/>
  <circle cx="150" cy="150" r="128" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.45"/>

  <!-- Cubo Isométrico 3D -->
  <!-- Cara Superior -->
  <polygon points="150,68 220,108 150,148 80,108" fill="url(#cyanGrad)" opacity="0.92" filter="url(#neonGlow)"/>
  <!-- Cara Izquierda -->
  <polygon points="80,108 150,148 150,228 80,188" fill="url(#blueSide)" opacity="0.95"/>
  <!-- Cara Derecha -->
  <polygon points="150,148 220,108 220,188 150,228" fill="#0b1a33" stroke="#00f0ff" stroke-width="2"/>

  <!-- Líneas de capas de impresión 3D -->
  <line x1="158" y1="162" x2="212" y2="131" stroke="#00f0ff" stroke-width="2" opacity="0.65"/>
  <line x1="158" y1="180" x2="212" y2="149" stroke="#00f0ff" stroke-width="2" opacity="0.65"/>
  <line x1="158" y1="198" x2="212" y2="167" stroke="#00f0ff" stroke-width="2" opacity="0.65"/>

  <!-- Aristas brillantes -->
  <polyline points="80,108 150,148 220,108" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
  <line x1="150" y1="148" x2="150" y2="228" stroke="#00f0ff" stroke-width="2.5"/>
  <polygon points="150,68 220,108 220,188 150,228 80,188 80,108" fill="none" stroke="#00f0ff" stroke-width="2.5"/>

  <!-- Texto / Insignia central -->
  <text x="150" y="264" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="800" font-size="22" letter-spacing="3">
    INNOVA <tspan fill="#00f0ff">3D</tspan>
  </text>
</svg>
